# Git runs with an empty configuration, so the user's global settings
# (commit signing, hooks) stay out of the fixture.
[[e2e]]
name = "git_state_as_an_explicit_input"
comment = """
`.git` is never tracked automatically, but typedoc puts the commit hash into its source links, so the task lists `.git/HEAD` and `.git/refs/**` as explicit inputs. A run without changes hits; a new commit changes `.git/refs/heads/main` and misses.
"""
ignore = true
steps = [
  { argv = [
    "git",
    "init",
    "-q",
    "-b",
    "main",
  ], envs = [
    [
      "GIT_CONFIG_NOSYSTEM",
      "1",
    ],
    [
      "GIT_CONFIG_GLOBAL",
      ".gitconfig-none",
    ],
  ] },
  { argv = [
    "git",
    "add",
    "-A",
  ], envs = [
    [
      "GIT_CONFIG_NOSYSTEM",
      "1",
    ],
    [
      "GIT_CONFIG_GLOBAL",
      ".gitconfig-none",
    ],
  ] },
  { argv = [
    "git",
    "-c",
    "user.name=vp",
    "-c",
    "user.email=vp@example.com",
    "commit",
    "-q",
    "-m",
    "initial",
  ], envs = [
    [
      "GIT_CONFIG_NOSYSTEM",
      "1",
    ],
    [
      "GIT_CONFIG_GLOBAL",
      ".gitconfig-none",
    ],
  ] },
  { argv = [
    "vt",
    "run",
    "docs",
  ], comment = "cache miss" },
  { argv = [
    "vtt",
    "grep-file",
    "docs/functions/add.html",
    "blob/",
  ], comment = "the source link carries the commit" },
  { argv = [
    "vt",
    "run",
    "docs",
  ], comment = "cache hit" },
  { argv = [
    "git",
    "-c",
    "user.name=vp",
    "-c",
    "user.email=vp@example.com",
    "commit",
    "-q",
    "--allow-empty",
    "-m",
    "empty",
  ], envs = [
    [
      "GIT_CONFIG_NOSYSTEM",
      "1",
    ],
    [
      "GIT_CONFIG_GLOBAL",
      ".gitconfig-none",
    ],
  ], comment = "a new commit, no file changes" },
  { argv = [
    "vt",
    "run",
    "docs",
  ], comment = "cache miss: the branch's ref changed" },
]

[[e2e]]
name = "created_dist_may_be_missing_or_incomplete"
comment = """
`vite build` creates `dist`, so the cache entry accepts a tree without `dist` (a clean checkout) and restores it on a hit, and a `dist` missing some of its entries, which the hit restores. A hit doesn't delete: a chunk an older build left in `dist` stays after a hit, until `dist` is deleted.
"""
ignore = true
steps = [
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache miss, creates dist/" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit: dist/ is as the build left it" },
  { argv = [
    "vtt",
    "rm",
    "-rf",
    "dist",
  ], comment = "a clean checkout has no dist/" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit: a directory the build created may be missing" },
  { argv = [
    "vtt",
    "stat-file",
    "dist/assets/main.js",
  ], comment = "restored from the cache" },
  { argv = [
    "vtt",
    "rm",
    "dist/assets/main.js",
  ], comment = "one chunk deleted from dist/" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit: a directory the build created may be missing some of its entries" },
  { argv = [
    "vtt",
    "stat-file",
    "dist/assets/main.js",
  ], comment = "restored from the cache" },
  { argv = [
    "vtt",
    "write-file",
    "dist/assets/stale.js",
    "stale",
  ], comment = "a chunk left by an older build" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit: a hit doesn't delete files" },
  { argv = [
    "vtt",
    "stat-file",
    "dist/assets/stale.js",
  ], comment = "still there" },
  { argv = [
    "vtt",
    "rm",
    "-rf",
    "dist",
  ], comment = "delete dist/ to get a clean one" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit: restores dist/" },
  { argv = [
    "vtt",
    "stat-file",
    "dist/assets/stale.js",
  ], comment = "gone: the hit restored only what the build wrote" },
]
